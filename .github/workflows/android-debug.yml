name: Android debug APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    name: Export Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Godot 4.4.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;23.2.8568313"

      - name: Install matching Godot export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable" /tmp/godot-templates
          curl -L --fail --retry 3 -o /tmp/godot-templates.tpz "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz"
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          if [ -d /tmp/godot-templates/templates ]; then
            cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          else
            cp -a /tmp/godot-templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          fi
          if [ -f /tmp/godot-templates/version.txt ]; then
            cp /tmp/godot-templates/version.txt "$HOME/.local/share/godot/export_templates/4.4.1.stable/version.txt"
          else
            printf '4.4.1.stable\n' > "$HOME/.local/share/godot/export_templates/4.4.1.stable/version.txt"
          fi

      - name: Configure Godot Android export settings
        run: |
          mkdir -p "$HOME/.config/godot"
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Zayron,C=OM"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          EOF

      - name: Import and validate project
        run: |
          godot --version
          godot --headless --editor --path . --quit
          godot --headless --path . --quit-after 5

      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/ZayronSimulator-debug.apk

      - name: Verify APK artifact
        run: |
          test -s build/ZayronSimulator-debug.apk
          file build/ZayronSimulator-debug.apk

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ZayronSimulator-Android-debug
          path: build/ZayronSimulator-debug.apk
          if-no-files-found: error
          retention-days: 14
